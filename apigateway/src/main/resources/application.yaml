server:
  port: 2027

# Enable Spring Boot debug logging and startup diagnostics
debug: true

spring:
  application:
    name: apigateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:30080/realms/microservices-realm
      client:
        registration:
          keycloak:
            client-id: apigateway-client
            client-secret: your-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:2027/login/oauth2/code/keycloak
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: http://localhost:30080/realms/microservices-realm
            user-name-attribute: preferred_username

  cloud:
    gateway:
      routes:
        - id: user-service-route
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=1
        - id: logout-route
          uri: forward:/logout
          predicates:
            - Path=/auth/logout

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# Keycloak Configuration
keycloak:
  realm: microservices-realm
  auth-server-url: http://localhost:30080
  resource: apigateway-client
  public-client: false
  credentials:
    secret: your-client-secret

kind: Application

server:
  port: 2027
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never

spring:
  application:
    name: apigateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri (not issuer-uri) — keys are fetched lazily on first request,
          # so the app starts even when Keycloak is not yet running.
          jwk-set-uri: http://localhost:30080/realms/microservices-realm/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: apigateway-client
            client-secret: your-client-secret        # replace after Keycloak setup
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:2027/login/oauth2/code/keycloak
            scope: openid, profile, email
        provider:
          keycloak:
            authorization-uri: http://localhost:30080/realms/microservices-realm/protocol/openid-connect/auth
            token-uri: http://localhost:30080/realms/microservices-realm/protocol/openid-connect/token
            jwk-set-uri: http://localhost:30080/realms/microservices-realm/protocol/openid-connect/certs
            user-info-uri: http://localhost:30080/realms/microservices-realm/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # HOW TO ADD A NEW MICROSERVICE:
            # 1. Create a K8s Service with a name matching the uri host below (e.g. http://my-service:PORT).
            # 2. Add a route entry below with a CircuitBreaker filter — copy one of the blocks here.
            # 3. Add a resilience4j.circuitbreaker.instances entry matching the circuit breaker id.
            # 4. Add its paths to SecurityConfig.securityFilterChain().
            - id: user-service-users
              uri: http://user-service:2026
              predicates:
                - Path=/api/v1/users/**
              filters:
                - AddRequestHeader=X-Gateway-Secret, ${gateway.internal-secret}
                - name: CircuitBreaker
                  args:
                    id: user-service
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504
            - id: user-service-auth
              uri: http://user-service:2026
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - AddRequestHeader=X-Gateway-Secret, ${gateway.internal-secret}
                - name: CircuitBreaker
                  args:
                    id: user-service
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504
            - id: order-service
              uri: http://order-service:2029
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - AddRequestHeader=X-Gateway-Secret, ${gateway.internal-secret}
                - name: CircuitBreaker
                  args:
                    id: order-service
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504
            - id: product-service-products
              uri: http://product-service:2028
              predicates:
                - Path=/api/v1/products/**
              filters:
                - AddRequestHeader=X-Gateway-Secret, ${gateway.internal-secret}
                - name: CircuitBreaker
                  args:
                    id: product-service
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504
            - id: product-service-categories
              uri: http://product-service:2028
              predicates:
                - Path=/api/v1/categories/**
              filters:
                - AddRequestHeader=X-Gateway-Secret, ${gateway.internal-secret}
                - name: CircuitBreaker
                  args:
                    id: product-service
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504
            - id: payment-service
              uri: http://payment-service:2030
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - AddRequestHeader=X-Gateway-Secret, ${gateway.internal-secret}
                - name: CircuitBreaker
                  args:
                    id: payment-service
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504
gateway:
  internal-secret: gw-secret-change-in-prod

# ── Resilience4j circuit breaker ─────────────────────────────────────────────
#
# Sliding window: last 10 calls (COUNT_BASED).
# Circuit opens when ≥50% fail or ≥80% are slow (>2 s).
# After 30 s in OPEN state, 3 probe calls are allowed (HALF_OPEN).
# If probes succeed → CLOSED; if they fail → back to OPEN.
#
# order-service uses tighter thresholds because a cascade failure there
# causes stock deductions in product-service — erring on the side of fast open.
#
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
    instances:
      user-service:
        base-config: default
      order-service:
        base-config: default
        failure-rate-threshold: 40        # trip sooner — prevents stock cascade
        wait-duration-in-open-state: 20s
      product-service:
        base-config: default
      payment-service:
        base-config: default
        failure-rate-threshold: 40

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info,circuitbreakers,circuitbreakerevents
  endpoint:
    prometheus:
      access: unrestricted
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:30418/v1/traces

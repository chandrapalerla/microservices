spring.application.name=order-service
server.port=2029

spring.datasource.url=jdbc:mysql://localhost:30036/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:30080/realms/microservices-realm/protocol/openid-connect/certs

gateway.internal-secret=gw-secret-change-in-prod

spring.kafka.bootstrap-servers=localhost:9092

# ── Producer reliability ───────────────────────────────────────────────────────
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# acks=all + idempotence guarantee exactly-once writes to the broker
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=3

# ── Consumer (PAYMENT_FAILED self-consumption) ────────────────────────────────
spring.kafka.consumer.group-id=order-service-internal
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.order.kafka.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.order.kafka.event.OrderEvent

spring.hazelcast.config=classpath:hazelcast.xml
spring.cache.type=hazelcast

services.user-service.url=http://user-service:2026
services.product-service.url=http://product-service:2028

resilience4j.circuitbreaker.instances.user-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.user-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.user-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.user-service.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.user-service.slow-call-rate-threshold=80

resilience4j.circuitbreaker.instances.product-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.product-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.product-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.product-service.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.user-service.max-attempts=3
resilience4j.retry.instances.user-service.wait-duration=1s
resilience4j.retry.instances.user-service.retry-exceptions=java.io.IOException,feign.FeignException.ServiceUnavailable

resilience4j.retry.instances.product-service.max-attempts=3
resilience4j.retry.instances.product-service.wait-duration=1s
# Include FeignException$Conflict (HTTP 409) so that optimistic-lock collisions on
# deductStock are retried by order-service as well as by product-service internally
resilience4j.retry.instances.product-service.retry-exceptions=feign.FeignException$Conflict,feign.RetryableException,java.net.ConnectException,java.io.IOException

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Actuator / Prometheus ──────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# ── Distributed Tracing (OTel → OTel Collector NodePort) ─────────────────────
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:30418/v1/traces

# Local dev profile — MockGateway is active, Razorpay SDK never called.
# Start with: mvn spring-boot:run -Dspring-boot.run.profiles=local

# MockGateway handles CARD/UPI/NET_BANKING/WALLET — always returns success.
# To simulate a payment failure: set MOCK_PAYMENT_FAIL=true in environment,
# or use any order amount ending in .99 (e.g. 99.99, 499.99).

# Razorpay disabled — values are placeholders (MockGateway is active instead)
payment.gateway.razorpay.enabled=false
payment.gateway.razorpay.key-id=local_mock
payment.gateway.razorpay.key-secret=local_mock
payment.gateway.razorpay.webhook-secret=local_mock

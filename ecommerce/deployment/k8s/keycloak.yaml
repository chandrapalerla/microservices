# ==================================
# KEYCLOAK — Identity & Access Management
# Admin UI:  http://localhost:30080/admin
# Token URL: http://localhost:30080/realms/microservices-realm/protocol/openid-connect/token
#
# FIXES applied vs original:
#  - Removed duplicate nodePort field (caused kubectl apply error)
#  - Pinned image to keycloak:26.0.7 (was 'latest')
#  - Added PersistentVolumeClaim so realm/user data survives pod restarts
#  - Moved admin password into a Kubernetes Secret
#  - Added readinessProbe so pods only receive traffic once Keycloak is ready
#  - Added namespace: ecommerce to all resources
#  - Set KC_HOSTNAME_STRICT=false and KC_HTTP_ENABLED=true for local dev
# ==================================

# ── Namespace ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce

---
# ── Secret (admin credentials) ──────────────────────────────────────────────
# admin-password = admin123  (echo -n "admin123" | base64)
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: ecommerce
type: Opaque
data:
  admin-password: YWRtaW4xMjM=

---
# ── PersistentVolumeClaim ────────────────────────────────────────────────────
# Keycloak uses dev-file DB (H2 file-based) in start-dev mode.
# Mount /opt/keycloak/data so the realm config is NOT lost on restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-pvc
  namespace: ecommerce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# ── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: ecommerce
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.7   # pinned — do not use 'latest'
          args: ["start-dev"]
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: admin-password
            # Use file-based H2 (persisted via PVC) instead of in-memory H2
            - name: KC_DB
              value: dev-file
            # Required for local/NodePort access (no TLS)
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
          # Wait until Keycloak's master realm is ready before routing traffic
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: keycloak-data
          persistentVolumeClaim:
            claimName: keycloak-pvc

---
# ── Service (NodePort) ───────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080   # access at http://localhost:30080

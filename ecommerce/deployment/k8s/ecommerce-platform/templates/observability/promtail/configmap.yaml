apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: ecommerce
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.ecommerce.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          # Parse CRI log format added by containerd (Rancher Desktop runtime)
          - cri: {}
          # Extract level from our JSON logs for labeling
          - json:
              expressions:
                level: level
                service: service
          - labels:
              level:
              service:
        relabel_configs:
          # Drop pods with no running containers
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed|Completed
            action: drop
          # Map pod metadata to labels
          - source_labels: [__meta_kubernetes_pod_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          # Build the log file path: /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            separator: /
            replacement: /var/log/pods/*$1/*.log
            target_label: __path__

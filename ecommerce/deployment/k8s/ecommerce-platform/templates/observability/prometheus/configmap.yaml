apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ecommerce
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: apigateway
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['apigateway.ecommerce.svc.cluster.local:2027']
            labels:
              service: apigateway

      - job_name: user-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['user-service.ecommerce.svc.cluster.local:2026']
            labels:
              service: user-service

      - job_name: order-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['order-service.ecommerce.svc.cluster.local:2029']
            labels:
              service: order-service

      - job_name: product-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['product-service.ecommerce.svc.cluster.local:2028']
            labels:
              service: product-service

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [ecommerce]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

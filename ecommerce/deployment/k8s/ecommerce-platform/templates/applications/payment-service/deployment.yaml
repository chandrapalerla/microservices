apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ecommerce
  labels:
    app: payment-service
    version: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: payment-service
        version: "1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "2030"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: payment-service
          image: ecommerce/payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2030
          envFrom:
            - configMapRef:
                name: payment-service-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
            - name: GATEWAY_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secret
                  key: internal-secret
            - name: PAYMENT_GATEWAY_RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: payment-service-secret
                  key: razorpay-key-id
            - name: PAYMENT_GATEWAY_RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: payment-service-secret
                  key: razorpay-key-secret
            - name: PAYMENT_GATEWAY_RAZORPAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: payment-service-secret
                  key: razorpay-webhook-secret
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 2030
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 2030
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 2030
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

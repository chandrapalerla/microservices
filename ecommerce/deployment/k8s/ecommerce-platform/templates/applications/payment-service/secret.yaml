apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secret
  namespace: ecommerce
type: Opaque
stringData:
  # Razorpay credentials — replace with real base64-encoded values before production deploy.
  # To enable Razorpay: set PAYMENT_GATEWAY_RAZORPAY_ENABLED=true in configmap.yaml
  # and populate these values from your Razorpay dashboard (Test or Live keys).
  razorpay-key-id: "YOUR_RAZORPAY_KEY_ID"
  razorpay-key-secret: "YOUR_RAZORPAY_KEY_SECRET"
  razorpay-webhook-secret: "YOUR_RAZORPAY_WEBHOOK_SECRET"

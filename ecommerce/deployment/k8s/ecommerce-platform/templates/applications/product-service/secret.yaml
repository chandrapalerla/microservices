# MinIO / AWS S3 credentials for product image storage.
# For local dev MinIO: access-key = minioadmin, secret-key = minioadmin
# echo -n "minioadmin" | base64  →  bWluaW9hZG1pbg==
apiVersion: v1
kind: Secret
metadata:
  name: product-s3-secret
  namespace: ecommerce
type: Opaque
data:
  access-key: bWluaW9hZG1pbg==    # minioadmin — [CHANGE IN PROD]
  secret-key: bWluaW9hZG1pbg==    # minioadmin — [CHANGE IN PROD]

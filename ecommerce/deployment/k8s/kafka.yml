# ==================================
# APACHE KAFKA — KRaft Mode (no ZooKeeper)
# Version: 3.9.0
#
# KRaft = Kafka Raft — Kafka manages its own metadata without ZooKeeper.
# This single-node deployment runs broker + controller in the same process.
#
# ── Connection strings ──────────────────────────────────────────────────────
#   In-cluster  (K8s pods) : kafka-service.ecommerce.svc.cluster.local:9092
#   Local dev   (host)     : localhost:30092  (NodePort)
#
# ── Spring Boot config ──────────────────────────────────────────────────────
#   Running LOCALLY (services on your machine, Kafka in K8s):
#     spring.kafka.bootstrap-servers=localhost:30092
#
#   Running IN KUBERNETES (services deployed as pods):
#     spring.kafka.bootstrap-servers=kafka-service.ecommerce.svc.cluster.local:9092
#
# ── Apply ────────────────────────────────────────────────────────────────────
#   kubectl apply -f deployment/k8s/kafka.yml
#
# ── Topics created automatically ─────────────────────────────────────────────
#   product-events  (3 partitions) — published by product-service
#   order-events    (3 partitions) — published by order-service
#   (Spring Boot NewTopic @Bean creates them if they don't exist)
#
# ── Useful kubectl commands ───────────────────────────────────────────────────
#   # Watch pod startup
#   kubectl get pods -n ecommerce -l app=kafka -w
#
#   # List all topics
#   kubectl exec -n ecommerce deploy/kafka -- \
#     kafka-topics.sh --bootstrap-server localhost:9092 --list
#
#   # Describe a topic
#   kubectl exec -n ecommerce deploy/kafka -- \
#     kafka-topics.sh --bootstrap-server localhost:9092 --describe --topic product-events
#
#   # Tail a topic (consumer group "debug")
#   kubectl exec -n ecommerce deploy/kafka -- \
#     kafka-console-consumer.sh --bootstrap-server localhost:9092 \
#       --topic order-events --from-beginning
#
#   # Consumer group lag
#   kubectl exec -n ecommerce deploy/kafka -- \
#     kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --all-groups
# ==================================

# ── Namespace (idempotent — already in databases.yml) ────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce

---
# ==================================
# PERSISTENT VOLUME CLAIM
# Stores Kafka log segments so messages survive pod restarts.
# ==================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: ecommerce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi   # Kafka retains messages; increase for higher-volume production use

---
# ==================================
# DEPLOYMENT
# Combined broker + controller in KRaft mode (no ZooKeeper required).
# ==================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: ecommerce
  labels:
    app: kafka
spec:
  replicas: 1   # single-node dev cluster — scale with StatefulSet for production HA
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0   # pinned — do not use 'latest'

          ports:
            - name: plaintext           # in-cluster client traffic
              containerPort: 9092
            - name: controller          # KRaft internal controller port (not exposed outside pod)
              containerPort: 9093
            - name: external            # host-machine dev access via NodePort 30092
              containerPort: 9094

          env:
            # ── KRaft identity ──────────────────────────────────────────────
            # node.id must be in controller.quorum.voters
            - name: KAFKA_NODE_ID
              value: "1"

            # Combined mode: this process is both broker and controller
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"

            # Single-node quorum: nodeId@host:controllerPort
            # localhost works here because broker and controller share the same JVM
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"

            # ── Cluster ID ──────────────────────────────────────────────────
            # URL-safe base64-encoded UUID.  Storage is formatted with this ID on
            # first startup; subsequent restarts (PVC has data) skip formatting.
            # Generate your own: kubectl exec deploy/kafka -- kafka-storage.sh random-uuid
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"

            # ── Listeners ───────────────────────────────────────────────────
            # PLAINTEXT  — in-cluster client traffic    (port 9092)
            # CONTROLLER — KRaft controller traffic     (port 9093, pod-internal)
            # EXTERNAL   — host-machine dev access      (port 9094 → NodePort 30092)
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"

            # What clients receive when they ask "where are the brokers?".
            # PLAINTEXT: K8s DNS name — used by pods in the same cluster.
            # EXTERNAL : localhost:30092 — used by services on the dev machine.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-service.ecommerce.svc.cluster.local:9092,EXTERNAL://localhost:30092"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"

            # ── Storage ─────────────────────────────────────────────────────
            - name: KAFKA_LOG_DIRS
              value: "/var/kafka-data"

            # ── Topic defaults ───────────────────────────────────────────────
            # Default partition count for auto-created topics.
            # Spring Boot's NewTopic @Bean will override per-topic if needed.
            - name: KAFKA_NUM_PARTITIONS
              value: "3"

            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"   # single broker — cannot replicate further

            # ── Replication factors (must be ≤ broker count) ─────────────────
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            # ── Topic auto-creation ──────────────────────────────────────────
            # true = Spring Boot can auto-create topics via NewTopic @Bean.
            # Set false in production and pre-create topics with exact configs.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"

            # ── Log retention ────────────────────────────────────────────────
            # Retain messages for 7 days (dev default).
            # Increase retention.bytes and reduce retention.ms for production.
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"

            - name: KAFKA_LOG_RETENTION_BYTES
              value: "-1"   # unlimited by size; limited only by time

            # ── Performance / latency ─────────────────────────────────────────
            # Reduce batch linger for lower latency in dev (default 0 ms = immediate send)
            - name: KAFKA_LINGER_MS
              value: "0"

          volumeMounts:
            - name: kafka-data
              mountPath: /var/kafka-data

          # ── Health probes ──────────────────────────────────────────────────
          # Readiness: broker is ready when it accepts TCP connections on 9092
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6

          # Liveness: restart if the broker stops accepting connections
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 3

          # ── Resource limits ────────────────────────────────────────────────
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-pvc

---
# ==================================
# SERVICE
# Single NodePort service exposing two ports:
#   9092 → in-cluster access (PLAINTEXT listener)
#            bootstrap: kafka-service.ecommerce.svc.cluster.local:9092
#   9094 → NodePort 30092, external/host access (EXTERNAL listener)
#            bootstrap: localhost:30092
# ==================================
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
      # No nodePort — only reachable from within the K8s cluster.
      # Use for pod-to-pod communication (e.g., microservices deployed in K8s).

    - name: external
      port: 9094
      targetPort: 9094
      nodePort: 30092   # access from host machine at localhost:30092

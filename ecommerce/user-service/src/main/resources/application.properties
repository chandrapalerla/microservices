spring.application.name=user-service
server.port=2026

spring.datasource.url=jdbc:mysql://localhost:30036/user_db
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.auto-commit=true

spring.jpa.database=mysql
# validate — Hibernate checks that every @Column matches the DB schema but never alters it.
# Flyway owns the schema; if columns don't match the migration the app refuses to start.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ── Flyway ───────────────────────────────────────────────────────────────────
# Scripts must be in classpath:db/migration/ named V{n}__{description}.sql
# Spring Boot auto-runs Flyway before Hibernate validation on startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
spring.cloud.compatibility-verifier.enabled=false


spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:30080/realms/microservices-realm/protocol/openid-connect/certs


spring.security.oauth2.client.registration.keycloak.client-id=user-service-client
spring.security.oauth2.client.registration.keycloak.client-secret=your-service-client-secret
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:30080/realms/microservices-realm/protocol/openid-connect/token

gateway.internal-secret=gw-secret-change-in-prod

spring.hazelcast.config=classpath:hazelcast.xml
spring.cache.type=hazelcast

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.groups-order=DESC
springdoc.show-actuator=false


# ── Actuator / Prometheus ──────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# ── Distributed Tracing (OTel → OTel Collector NodePort) ─────────────────────
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:30418/v1/traces
# ─── Application ─────────────────────────────────────────────────────────────
spring.application.name=product-service
server.port=2028

# ─── MySQL ────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:30036/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway runs migrations before JPA validates — never use ddl-auto=update/create
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ─── Eureka ───────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ─── Security / Keycloak JWT ──────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:30080/realms/microservices-realm/protocol/openid-connect/certs

# Must match apigateway gateway.internal-secret
gateway.internal-secret=gw-secret-change-in-prod

# ─── Kafka ────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer (STOCK_LOW / STOCK_OUT self-listener — groupId isolates from external consumers)
spring.kafka.consumer.group-id=product-service-alerts
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.product.kafka.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.product.kafka.event.ProductEvent

# ─── Hazelcast ────────────────────────────────────────────────────────────────
spring.hazelcast.config=classpath:hazelcast.xml
spring.cache.type=hazelcast

# ─── Swagger / Springdoc ──────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Actuator / Prometheus ──────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# ── Distributed Tracing (OTel → OTel Collector NodePort) ─────────────────────
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:30418/v1/traces

# ── S3 / MinIO image storage ──────────────────────────────────────────────────
# Set endpoint to MinIO URL for local dev; leave empty for real AWS S3
cloud.aws.s3.bucket=product-images
cloud.aws.s3.region=us-east-1
cloud.aws.s3.endpoint=http://localhost:9000
cloud.aws.credentials.access-key=minioadmin
cloud.aws.credentials.secret-key=minioadmin

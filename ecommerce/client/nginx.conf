server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router — all unmatched paths return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* → API Gateway (matches axios baseURL: '/api')
    location /api/ {
        proxy_pass http://apigateway:2027/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Proxy /auth/* → API Gateway (token refresh + login/logout endpoints)
    location /auth/ {
        proxy_pass http://apigateway:2027/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}

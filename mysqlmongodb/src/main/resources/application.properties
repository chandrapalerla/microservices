spring.application.name=mysqlmongodb

server.port=2026

# MySQL
spring.datasource.url=jdbc:mysql://localhost:30036/user_db
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.auto-commit=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# MongoDB
spring.data.mongodb.uri=mongodb://admin:admin123@localhost:30017/OrderDB?authSource=admin
spring.data.mongodb.auto-index-creation=false

# Lazy initialize MongoDB to prevent startup failures
spring.data.mongodb.lazy-initialization=true

# Connection timeout settings (in milliseconds)
spring.data.mongodb.socket-keep-alive=true
spring.data.mongodb.ssl.enabled=false

# Server startup settings - prevent database validation from blocking startup
spring.jpa.database=mysql

# Logging
logging.level.root=INFO
logging.level.com.mysql.cj.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG


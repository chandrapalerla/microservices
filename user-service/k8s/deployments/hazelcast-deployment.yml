apiVersion: apps/v1
kind: Deployment
metadata:
  name: hazelcast
  namespace: user-service
  labels:
    app: hazelcast
    version: "5.7"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hazelcast
  template:
    metadata:
      labels:
        app: hazelcast
        version: "5.7"
    spec:
      containers:
        - name: hazelcast
          image: hazelcast/hazelcast:5.7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5701
              name: hazelcast
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
      restartPolicy: Always


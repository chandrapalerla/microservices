spring.application.name=user-service
server.port=2026
debug=true

# MySQL
spring.datasource.url=jdbc:mysql://localhost:30036/user_db
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.auto-commit=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server startup settings - prevent database validation from blocking startup
spring.jpa.database=mysql

# API Documentation (Springdoc OpenAPI / Swagger)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.groups-order=DESC
springdoc.show-actuator=false

# Hazelcast Caching
spring.hazelcast.config=classpath:hazelcast.xml
spring.cache.type=hazelcast
# Cache TTL (time to live) in seconds
hazelcast.cache.ttl=600
# Hazelcast network settings for distributed caching
hazelcast.network.join.auto-increment-port=true

# Logging
logging.level.root=INFO
logging.level.com.mysql.cj.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.hazelcast=INFO
spring.cloud.compatibility-verifier.enabled=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.main.web-application-type=reactive

# Keycloak/OAuth2 Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:30080/realms/microservices-realm
spring.security.oauth2.client.registration.keycloak.client-id=user-service-client
spring.security.oauth2.client.registration.keycloak.client-secret=your-service-client-secret
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:30080/realms/microservices-realm
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:30080/realms/microservices-realm/protocol/openid-connect/token

# JWT Configuration
jwt.issuer=http://localhost:30080/realms/microservices-realm
jwt.audience=user-service

springdoc.swagger-ui.oauth.client-id=swagger-client
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

